<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobase - 3D Wasteland</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js & PointerLock Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  
  <!-- Firebase Libraries (Compat for vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="crosshair"></div>
  
  <div id="hud">
    <h2>MOBASE 3D</h2>
    <p>Survivor: <span id="player-name">Guest</span></p>
    <p>Status: <span id="status" class="warning">Sign in required</span></p>
    <p>Players Online: <span id="player-count">0</span></p>
  </div>

  <div id="blocker">
    <div id="instructions">
      <h1>MOBASE WASTELAND</h1>
      <p id="login-subtext">Sign in with Google to enter the world and save your base!</p>
      
      <button id="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Sign in with Google
      </button>

      <div id="controls-info" style="display: none; margin-top: 20px;">
        <p style="color: #00ff66; margin-bottom: 10px;"><b>CLICK ANYWHERE TO ENTER GAME</b></p>
        <p style="font-size: 0.85rem; color: #aaffcc;">
          <b>WASD</b>: Walk | <b>SPACE</b>: Jump | <b>LEFT CLICK</b>: Build Wall | <b>ESC</b>: Pause
        </p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
