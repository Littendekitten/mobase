<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobase - 3D Multiplayer</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  
  <!-- Firebase (Compat version for vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="crosshair"></div>
  
  <div id="hud">
    <h2>MOBASE</h2>
    <p id="status" class="warning">Connecting to Firebase...</p>
    <p>Survivors Online: <span id="player-count">1</span></p>
  </div>

  <div id="blocker">
    <div id="instructions">
      <h1>CLICK TO ENTER THE WASTELAND</h1>
      <p><b>WASD</b>: Move | <b>SPACE</b>: Jump | <b>LEFT CLICK</b>: Build Wall | <b>ESC</b>: Pause</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
